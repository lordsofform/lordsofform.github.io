<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Contact — For Minds That Desire Different</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@900&display=swap" rel="stylesheet">
<style>
:root{--blue:#506FE0;--pink:#CC5264;--lemon:#FFF200;--black:#000}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--blue);color:var(--pink);font-family:"League Spartan","Arial Black",Arial,sans-serif}
body{min-height:100vh;min-height:100svh}
.page{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.wrap{width:min(900px,94vw);display:flex;flex-direction:column;align-items:center}
.eyebrow{color:var(--lemon);text-transform:uppercase;font-weight:900;letter-spacing:.14em;font-size:clamp(10px,1.2vw,14px);-webkit-text-stroke:.8px var(--black);paint-order:stroke fill;margin-bottom:8px}
.title{margin:0;font-size:clamp(64px,11vw,150px);line-height:.82;letter-spacing:-.055em;color:var(--pink);text-transform:lowercase;-webkit-text-stroke:2px var(--black);paint-order:stroke fill;text-align:center}
.intro{margin:20px 0 22px;max-width:720px;text-align:center;color:var(--lemon);font-size:clamp(15px,1.8vw,22px);line-height:1.15;-webkit-text-stroke:.6px var(--black);paint-order:stroke fill}
.form{width:min(760px,100%);display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1 / -1}
label{text-transform:uppercase;font-size:12px;letter-spacing:.08em;color:var(--lemon);-webkit-text-stroke:.6px var(--black);paint-order:stroke fill}
input,textarea{width:100%;border:3px solid var(--black);background:rgba(255,255,255,.06);color:#fff;font:700 16px/1.2 Arial,Helvetica,sans-serif;padding:14px;outline:none;box-shadow:4px 4px 0 var(--black)}
textarea{min-height:150px;resize:vertical}input:focus,textarea:focus{background:rgba(255,255,255,.12)}
.actions{grid-column:1 / -1;display:flex;justify-content:center;gap:14px;margin-top:8px;flex-wrap:wrap}
.btn{display:inline-block;border:3px solid var(--black);box-shadow:5px 5px 0 var(--black);text-decoration:none;text-transform:uppercase;font-weight:900;letter-spacing:.03em;cursor:pointer}
.btn-send{background:var(--lemon);color:var(--black);padding:14px 26px 12px;font-size:20px}
.direct-email{margin-top:16px;color:var(--lemon);font-size:14px;text-align:center;text-transform:uppercase;letter-spacing:.04em;-webkit-text-stroke:.4px var(--black);paint-order:stroke fill}
.direct-email a{color:var(--lemon);text-decoration:none;border-bottom:2px solid var(--black)}
.note{margin-top:18px;text-align:center;color:var(--lemon);font-size:12px;letter-spacing:.06em;text-transform:uppercase;-webkit-text-stroke:.5px var(--black);paint-order:stroke fill}
.back{display:block;width:max-content;margin:24px auto 0;padding:12px 20px 10px;border:3px solid var(--black);box-shadow:5px 5px 0 var(--black);background:var(--lemon);color:var(--black);text-decoration:none;text-transform:uppercase;font-size:18px;font-weight:900}
@media(max-width:700px){.page{padding:22px 12px 34px}.wrap{width:96vw}.title{font-size:clamp(62px,18vw,94px)}.intro{font-size:15px;margin:16px 0 18px}.form{grid-template-columns:1fr;gap:12px}.field.full{grid-column:auto}.actions{grid-column:auto;gap:10px}input,textarea{font-size:16px;padding:13px 12px}textarea{min-height:130px}.btn-send{font-size:18px;padding:13px 22px 11px}}
</style>
</head>
<body>
<main class="page">
  <div class="wrap">
    <div class="eyebrow">For Minds That Desire Different</div>
    <h1 class="title">contact</h1>
    <p class="intro">Like something you heard? Tell us what you’re working on and we’ll take it from there.</p>
    <form class="form" action="mailto:lordsofform@gmail.com" method="post" enctype="text/plain">
      <div class="field full"><label for="name">Name</label><input id="name" name="Name" type="text" placeholder="Your name"></div>
      <div class="field full"><label for="email">Email</label><input id="email" name="Email" type="email" placeholder="you@example.com"></div>
      <div class="field full"><label for="message">What are you working on?</label><textarea id="message" name="Message" placeholder="Tell us what you like, what you need, or just say hello."></textarea></div>
      <div class="actions"><button class="btn btn-send" type="submit">Send</button></div>
    </form>
    <div class="direct-email">or <a href="mailto:lordsofform@gmail.com">email</a></div>
    <div class="note">100% master + publishing controlled • direct sync clearance</div>
    <a class="back" href="index.html">Back</a>
  </div>
</main>
</body>
</html>
