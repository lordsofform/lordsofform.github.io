<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>For Minds That Desire Different</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@900&display=swap" rel="stylesheet">
<style>
:root{--blue:#506FE0;--pink:#CC5264;--lemon:#FFF200;--black:#000}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;width:100%;min-height:100%;background:var(--blue);font-family:"League Spartan","Arial Black",Arial,sans-serif}
body{min-height:100vh;min-height:100svh;overflow-x:hidden}
.hero{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 12px}
.stack{width:min(1480px,96vw);display:flex;flex-direction:column;align-items:center}
.top-title{color:var(--lemon);font-size:clamp(10px,.88vw,17.6px);letter-spacing:.16em;text-transform:uppercase;-webkit-text-stroke:1px var(--black);paint-order:stroke fill;margin-bottom:14px;transform:translateY(-5px)}
.line{display:flex;justify-content:center;align-items:center;text-align:center;font-weight:900;line-height:.86;letter-spacing:-.055em;white-space:nowrap;color:var(--pink);-webkit-text-stroke:4px var(--black);paint-order:stroke fill}
.l1{width:20%;font-size:clamp(38px,4.6vw,82px)}
.l2{width:38%;font-size:clamp(44px,5.8vw,100px)}
.l3{width:54%;font-size:clamp(56px,7.25vw,122px)}
.l4{width:76%;font-size:clamp(70px,9.35vw,158px)}
.l5{width:100%;font-size:clamp(88px,12.1vw,206px)}
.flip-holder{display:inline-flex;justify-content:center;align-items:center;min-width:8.8ch;perspective:900px}
.flipword{display:inline-block;font:inherit;color:var(--lemon);letter-spacing:inherit;transform-origin:center;will-change:transform,opacity;-webkit-text-stroke:3px var(--black);paint-order:stroke fill}
.flipword.is-minds{color:var(--lemon)!important}
.flipword.is-other{color:var(--lemon)!important}
.flip-out{animation:flipOut .45s ease-in forwards}
.flip-in{animation:flipIn .55s ease-out forwards}
@keyframes flipOut{0%{transform:rotateX(0deg);opacity:1}100%{transform:rotateX(-90deg);opacity:0}}
@keyframes flipIn{0%{transform:rotateX(90deg);opacity:0}100%{transform:rotateX(0deg);opacity:1}}
.rights-line{margin-top:10px;min-height:1.55em;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--lemon);text-transform:uppercase;font-weight:900;letter-spacing:.08em;font-size:clamp(11px,1.1vw,20px);-webkit-text-stroke:1px var(--black);paint-order:stroke fill;perspective:700px}
.rights-word{display:inline-block;transform-origin:center;will-change:transform,opacity}
.rights-word .fast{font-size:1.65em;color:var(--pink);-webkit-text-stroke:1.4px var(--black);paint-order:stroke fill;vertical-align:-.05em;margin-left:.08em}
.rights-out{animation:flipOut .45s ease-in forwards}
.rights-in{animation:flipIn .55s ease-out forwards}
.ctas{margin-top:24px;display:flex;gap:18px}
.btn{text-decoration:none;text-transform:uppercase;font-weight:900;border:3px solid var(--black);box-shadow:6px 6px 0 var(--black);font-size:clamp(22px,2.05vw,38px);padding:16px 28px 14px;min-width:190px;text-align:center}
.listen{background:var(--lemon);color:var(--black)}
.contact{background:var(--lemon);color:var(--pink);-webkit-text-stroke:.8px var(--black);paint-order:stroke fill}
@media(min-width:1800px){
  .stack{width:min(1680px,92vw)}
  .top-title{font-size:clamp(15.4px,.79vw,22px);margin-bottom:16px;transform:translateY(-7px)}
  .l1{font-size:clamp(68px,4.6vw,96px)}
  .l2{font-size:clamp(82px,5.8vw,120px)}
  .l3{font-size:clamp(100px,7.1vw,148px)}
  .l4{font-size:clamp(126px,9vw,188px)}
  .l5{font-size:clamp(162px,11.6vw,242px)}
  .rights-line{font-size:clamp(16px,1vw,22px)}
  .btn{font-size:clamp(28px,1.8vw,40px);padding:18px 34px 16px;min-width:220px}
}
@media(max-width:700px){
  .hero{align-items:flex-start;padding:max(5.5vh,env(safe-area-inset-top)) 6px max(4vh,env(safe-area-inset-bottom))}
  .stack{width:98vw}
  .top-title{font-size:clamp(10px,2.9vw,13px);letter-spacing:.12em;margin-bottom:7px;transform:none;-webkit-text-stroke:.8px var(--black)}
  .line{-webkit-text-stroke:2.5px var(--black)}
  .l1{width:34%;font-size:clamp(38px,10vw,50px)}
  .l2{width:72%;font-size:clamp(48px,13vw,64px)}
  .l3{width:78%;font-size:clamp(58px,15vw,74px)}
  .l4{width:92%;font-size:clamp(70px,18vw,88px)}
  .l5{width:100%;font-size:clamp(72px,19.4vw,94px)}
  .flip-holder{min-width:7.1ch}
  .flipword{-webkit-text-stroke:2px var(--black)}
  .rights-line{margin-top:10px;font-size:clamp(10px,2.7vw,13px);letter-spacing:.055em;min-height:2.4em;padding:0 8px;-webkit-text-stroke:.8px var(--black)}
  .rights-word .fast{font-size:1.45em;-webkit-text-stroke:1px var(--black)}
  .ctas{width:100%;gap:12px}
  .btn{font-size:clamp(21px,5.9vw,28px);padding:15px 18px 12px;min-width:0;flex:1;box-shadow:5px 5px 0 var(--black)}
}
@media(max-width:375px){
  .hero{padding-left:4px;padding-right:4px}
  .stack{width:99vw}
  .top-title{font-size:10px;letter-spacing:.1em}
  .l1{font-size:36px}
  .l2{font-size:46px}
  .l3{font-size:54px}
  .l4{font-size:66px}
  .l5{font-size:72px}
  .rights-line{font-size:10px;line-height:1.05;padding:0 6px}
  .ctas{gap:10px}
  .btn{font-size:20px;padding:14px 12px 11px}
}
</style>
</head>
<body>
<main class="hero">
  <div class="stack">
    <div class="top-title">Original Music for Sync</div>
    <div class="line l1">for</div>
    <div class="line l2"><span class="flip-holder"><span id="word" class="flipword">MINDS</span></span></div>
    <div class="line l3">that</div>
    <div class="line l4">desire</div>
    <div class="line l5">different</div>
    <div class="rights-line"><span id="rightsWord" class="rights-word">100% MASTER + PUBLISHING CONTROLLED</span></div>
    <div class="ctas">
      <a class="btn listen" href="listen.html">Listen</a>
      <a class="btn contact" href="contact.html">Contact</a>
    </div>
  </div>
</main>
<script>
const words=["MINDS","DIRECTORS","FILMMAKERS","EDITORS","CREATIVES","BRANDS","AGENCIES","PRODUCERS","SUPERVISORS","STUDIOS","STORYTELLERS","DREAMERS","OUTSIDERS","VISIONARIES","MAKERS","ARTISTS"];
const word=document.getElementById("word");
let i=0;
function setWordColor(){const isMinds=word.textContent.trim()==="MINDS";word.classList.toggle("is-minds",isMinds);word.classList.toggle("is-other",!isMinds)}
setWordColor();
const rights=["100% MASTER + PUBLISHING CONTROLLED","DIRECT SYNC CLEARANCE","NO THIRD-PARTY APPROVAL REQUIRED",'HEAR SOMETHING UNIQUE. CLEAR IT. GET WHAT YOU NEED. <span class="fast">FAST.</span>'];
const rightsWord=document.getElementById("rightsWord");
let r=0;
function syncFlip(){
  word.classList.remove("flip-in");
  word.classList.add("flip-out");
  rightsWord.classList.remove("rights-in");
  rightsWord.classList.add("rights-out");
  setTimeout(()=>{
    i=(i+1)%words.length;
    r=(r+1)%rights.length;
    word.textContent=words[i];
    setWordColor();
    rightsWord.innerHTML=rights[r];
    word.classList.remove("flip-out");
    rightsWord.classList.remove("rights-out");
    void word.offsetWidth;
    void rightsWord.offsetWidth;
    word.classList.add("flip-in");
    rightsWord.classList.add("rights-in");
  },450);
}
setInterval(syncFlip,3000);
</script>
</body>
</html>
